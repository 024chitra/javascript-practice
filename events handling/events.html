<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 12px;
      padding: 12px;
    }
    button {
      padding: 12px;
      margin: 12px;
    }
    .changeColor {
      color: white;
      background-color: chocolate;
    }
    #paragraph{
      margin: 12px;
      padding: 12px;
      border: 2px solid ;
      border-radius: 5px;
      word-break: break-word;
    }
    #hover{
      border: 2px solid;
      border-radius: 5px;
      padding: 60px;
      margin: 20px;
    }
    #press{
      padding: 40px;
      border: 2px solid ;
      text-align: center;
      font-size: x-large;
    }
    #Q16{
      padding: 40px;
      margin: 10px;
      border: 4px solid ;
      text-align: center;
    }

  </style>
  <body>
    <button id="button3">Click to change bgColor</button>
    <button id="button4">button 4</button>
    <button id="button1">Click here</button>
    <button id="button5">button 5</button>
    <button id="button2">Click to visit</button>
    <button id="button6">remove action from button 5</button>
    <button id="button7" class="changeColor">change color</button>
    <button id="button8">Start changing color</button>
    <button id="button9">Stop changing color</button>
    <button id="displayCount">00</button>
    <button id="incrementBtn">1+</button>
    <button id="stopBtn">Stop counting</button>
    <button id="continueBtn">Continue counting</button>
    <button id="resetBtn">reset</button>
    <input id="inputText" type="text" placeholder="type here">
    <p id="paragraph"> your paragraph</p>
    <select name="color" id="selectColor">
      <option value="select color" disabled selected>select color</option>
      <option value="red">red</option>
      <option value="green">green</option>
      <option value="blue">blue</option>
    </select>
    <p id="selectedColor">color selected</p>

    <div id="hover">
      mouse hover
    </div>

    <div id="press">_</div>
    
    <div id="Q16">
      <P id="lastKey">lat key</P>
      <P id="character"> characters</P>
    </div>
    <button id="buttonQ17">click</button>
    <br>
    <button id="buttonQ18">Apple</button>
    <button id="buttonQ18">Banana</button>
    <button id="buttonQ18">Orange</button>
    <p id="output">output</p>

    <button id="button19">type</button>

    <a id="link" href="example.com">visit here</a>
    <p id="linkOutput"></p>
    <script src="events.js"></script>
  </body>
</html>
