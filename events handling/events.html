<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Events</title>
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      margin: 12px;
      padding: 12px;
    }
    button {
      padding: 12px;
      margin: 12px;
    }
    .changeColor {
      color: white;
      background-color: chocolate;
    }
  </style>
  <body>
    <button id="button1">Click here</button>
    <button id="button2">Click to visit</button>
    <button id="button3">Click to change bgColor</button>
    <button id="button4">button 4</button>
    <button id="button5">button 5</button>
    <button id="button6">remove action from button 5</button>
    <button id="button7" class="changeColor">change color</button>
    <button id="button8">Start changing color</button>
    <button id="button9">Stop changing color</button>
    <button id="displayCount">00</button>
    <button id="incrementBtn">1+</button>
    <button id="stopBtn">Stop counting</button>
    <button id="continueBtn">Continue counting</button>
    <button id="resetBtn">reset</button>
    

    <script src="events.js"></script>
  </body>
</html>
