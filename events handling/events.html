    .changeColor {
      color: white;
      background-color: chocolate;
    }
    #paragraph {
      margin: 12px;
      padding: 12px;
      border: 2px solid;
      border-radius: 5px;
      word-break: break-word;
    }
    #hover {
      border: 2px solid;
      border-radius: 5px;
      padding: 60px;
      margin: 20px;
    }
    #press {
      padding: 40px;
      border: 2px solid;
      text-align: center;
      font-size: x-large;
    }
